default_language_version:
  python: python3.14
fail_fast: false
minimum_pre_commit_version: 4.1.0
repos:
  - hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - args:
          - --branch
          - main
        id: no-commit-to-branch
    repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
  - hooks:
      - exclude: ^\.pre-commit-config\.yaml|\.claude/
        id: detect-secrets
    repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
  - hooks:
      - id: shellcheck
        args:
          - --severity=warning
    repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
  - hooks:
      - exclude: ^(\.github/|workflows/|templates/|docker-compose)|(^|/)(pnpm-lock|yarn|uv|poetry)\.(yaml|lock)$|(^|/)\.pre-commit-config\.yaml$
        id: yaml-sorter
      - id: json-sorter
      - id: env-file-check
      - id: makefile-check
      - id: env-example-sync
      - id: adr-gate
      - id: claude-skill-frontmatter
      - id: claude-agent-frontmatter
      - id: claude-mcp-config
      - id: python-no-unittest-import
      - id: claude-assets-present
    repo: https://github.com/chrysa/pre-commit-tools
    rev: v0.2.0-253
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - args:
          - --fix
        id: markdownlint
        stages:
          - manual
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - args:
          - --error
          - DL3006
          - --error
          - DL3007
          - --failure-threshold
          - error
        files: (^|/)Dockerfile[^/]*$
        id: hadolint-docker
        types:
          - file
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages:
          - commit-msg
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - test
          - chore
          - perf
          - revert
          - ci
  - repo: https://github.com/chrysa/guideline-checker
    rev: v1.30.10
    hooks:
      - id: guideline-check
        args:
          - check
          - --fail-on
          - error
          - --baseline
          - .guideline-baseline.json
exclude: (^|/)quality_gate\.py$|^\.claude/ape/
